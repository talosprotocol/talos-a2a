[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talosprotocol-talos-a2a"
version = "1.0.0"
description = "Talos Protocol security and trust layer for Agent-to-Agent (A2A) v1, providing DIDs, Double Ratchet E2EE channels, capability tokens, and Merkle audit receipts."
readme = "README.md"
authors = [
    { name = "Talos Protocol Authors", email = "dev@talosprotocol.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/talos_a2a"]
